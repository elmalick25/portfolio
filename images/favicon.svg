<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle container avec dégradé royal purple -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Monogramme M en Plus Jakarta Sans bold épuré -->
  <path d="M 18 44 L 18 20 L 25 20 L 32 31.5 L 39 20 L 46 20 L 46 44 L 40 44 L 40 28 L 34 38 L 30 38 L 24 28 L 24 44 Z" 
        fill="#ffffff" 
        filter="url(#softGlow)" />

  <!-- Point signature accentué -->
  <circle cx="50" cy="41" r="3.2" fill="#8b5cf6" />
</svg>

